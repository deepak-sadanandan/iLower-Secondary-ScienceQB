        // Text Cleanup helper
        function cleanText(text) {
            return text.replace(/â†’/g, '→')
                       .replace(/Â³/g, '³')
                       .replace(/Â°/g, '°')
                       .replace(/Ã—/g, '×')
                       .replace(/Î©/g, 'Ω')
                       .replace(/â†/g, '←');
        }

        // CSV Parser
        function parseCSV(csv) {
            // Fix newlines
            csv = csv.replace(/\r\n/g, '\n');
            const rows = [];
            let row = [];
            let cell = "";
            let inQuotes = false;
            
            for (let i = 0; i < csv.length; i++) {
                const char = csv[i];
                if (char === '"' && csv[i+1] === '"') {
                    cell += '"'; i++;
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(cell.trim()); cell = "";
                } else if (char === '\n' && !inQuotes) {
                    row.push(cell.trim()); rows.push(row); row = []; cell = "";
                } else {
                    cell += char;
                }
            }
            if (cell !== "" || row.length > 0) {
                row.push(cell.trim()); rows.push(row);
            }
            return rows;
        }

        // Classification Engine based exactly on Syllabus.txt Rules
        function classifyQuestion(qRaw) {
            const q = qRaw.toLowerCase();
            
            // 1. Specific Edge Case Overrides
            if (q.includes("potato cube in salt")) return { sub: "Biology", top: "Cells" };
            if (q.includes("icecube melting")) return { sub: "Chemistry", top: "Particle model and state change" };
            if (q.includes("floating duck") || q.includes("bungee")) return { sub: "Physics", top: "Forces and motion" };

            // 2. Biology Rules
            if (/\b(reproduction|genetic|seed|menstrual|fertilization|breed|inheriting)\b/.test(q)) return { sub: "Biology", top: "Fertilization and implantation" };
            if (/\b(organ|heart|artery|vein|capillary|pulse|lung|breath|photosynthesis|digestive|respiratory|circulatory|diet|vitamin|mitochondria|respiration|atp|transpiration|anaemia|aerobic|anaerobic)\b/.test(q)) return { sub: "Biology", top: "Cell systems" };
            if (/\b(cell|cells|nucleus|diffusion|amoeba|vacuole|stomata|cytology|prokaryote|transport|tissue)\b/.test(q)) return { sub: "Biology", top: "Cells" };
            if (/\b(pathogen|malaria|competition|food web|producer|herbivore|ecosystem|population|antibiotic|rickets|scurvy|flu|salmonella|abiotic|biotic|decomposer|carnivore|adaptation|disease|living|trophic|immunity|yeast|virus|bacteria|penguin|slug|caterpillar)\b/.test(q)) return { sub: "Biology", top: "Variation and natural selection" };

            // 3. Physics Rules
            if (/\b(wave|sound|pitch|reflection|refraction|refracted|incidence|amplitude|frequency|optic|electromagnetic|light)\b/.test(q)) return { sub: "Physics", top: "Waves, sound, and light" };
            if (/\b(hooke|spring|work done|energy|efficiency|sankey|kinetic|potential|elastic|power|conservation)\b/.test(q)) return { sub: "Physics", top: "Energy" };
            if (/\b(circuit|voltage|resistor|current|ammeter|parallel|series|magnet|coil|charge|volt|resistance|static|induction|grid)\b/.test(q)) return { sub: "Physics", top: "Electricity and magnetism" };
            if (/\b(force|speed|distance-time|mass|weight|gravity|upthrust|friction|velocity|terminal|pivot|lever|orbit|drag|moment|parachute|satellite|kinematic|dynamic|acceleration|projectile)\b/.test(q)) return { sub: "Physics", top: "Forces and motion" };

            // 4. Chemistry Rules
            if (/\b(boil|melt|freez|gas pressure|sublimation|state change|diffuse|particle speed)\b/.test(q)) return { sub: "Chemistry", top: "Particle model and state change" };
            if (/\b(reactivity|displacement|extraction|catalyst|yield|marble chips|rate|zinc|copper chloride|metal sulfate|quantitative)\b/.test(q)) return { sub: "Chemistry", top: "Useful chemical reactions" };
            if (/\b(equation|ph|acid|alkali|exothermic|endothermic|neutralise|oxide|carbonate|burn|combustion|chemical change|physical change)\b/.test(q)) return { sub: "Chemistry", top: "Chemical changes" };
            if (/\b(formula|symbol|atomic|proton|neutron|electron|compound|mixture|group|period|separation|chromatography|distillation|element|isotope|polymer|ceramic|metal|nonmetal|molecule)\b/.test(q)) return { sub: "Chemistry", top: "Atoms and the Periodic Table" };

            // 5. Broad Fallbacks
            if (q.includes("animal") || q.includes("plant")) return { sub: "Biology", top: "Cells" };
            if (q.includes("temperature") || q.includes("solution") || q.includes("solid") || q.includes("liquid") || q.includes("gas") || q.includes("water") || q.includes("air")) return { sub: "Chemistry", top: "Particle model and state change" };
            if (q.includes("graph")) return { sub: "Physics", top: "Forces and motion" }; // Typically kinematics/dynamics

            return { sub: "Uncategorized", top: "Review Needed" };
        }

        const subtopicsBySubject = {
            "Biology": ["Cells", "Cell systems", "Fertilization and implantation", "Variation and natural selection"],
            "Chemistry": ["Particle model and state change", "Atoms and the Periodic Table", "Chemical changes", "Useful chemical reactions"],
            "Physics": ["Forces and motion", "Energy", "Waves, sound, and light", "Electricity and magnetism"]
        };

        const colors = {
            "Biology": "bg-green-100 text-green-800",
            "Chemistry": "bg-orange-100 text-orange-800",
            "Physics": "bg-blue-100 text-blue-800",
            "Uncategorized": "bg-gray-100 text-gray-800"
        };

        let processedData = [];

        // Initialization
        function init() {
            const parsed = parseCSV(rawCSV);
            // Skip header (i=1)
            for (let i = 1; i < parsed.length; i++) {
                if(parsed[i].length < 3) continue; // Skip malformed lines
                const qp = cleanText(parsed[i][0]);
                const qText = cleanText(parsed[i][1]);
                const marks = cleanText(parsed[i][2]);
                const classification = classifyQuestion(qText);
                
                processedData.push({ qp, sub: classification.sub, top: classification.top, qText, marks });
            }
            renderTable();
        }

        // Render functions
        function renderTable() {
            const tableBody = document.getElementById("tableBody");
            const searchVal = document.getElementById("searchInput").value.toLowerCase();
            const subjectVal = document.getElementById("subjectFilter").value;
            const subtopicVal = document.getElementById("subtopicFilter").value;

            tableBody.innerHTML = "";
            let count = 0;

            processedData.forEach(row => {
                // Apply Filters
                if (searchVal && !row.qText.toLowerCase().includes(searchVal) && !row.top.toLowerCase().includes(searchVal)) return;
                if (subjectVal && row.sub !== subjectVal) return;
                if (subtopicVal && row.top !== subtopicVal) return;

                count++;
                
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition-colors";
                
                const subColor = colors[row.sub] || colors["Uncategorized"];

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 font-medium">${row.qp}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${subColor}">${row.sub}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${row.top}</td>
                    <td class="px-6 py-4 text-sm text-slate-900">${row.qText}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700 text-center font-semibold bg-slate-50/50">${row.marks}</td>
                `;
                tableBody.appendChild(tr);
            });

            document.getElementById("resultsCount").innerText = `Showing ${count} questions`;
        }

        // Event Listeners
        document.getElementById("searchInput").addEventListener("input", renderTable);
        document.getElementById("subjectFilter").addEventListener("change", (e) => {
            const subtopicSelect = document.getElementById("subtopicFilter");
            const subject = e.target.value;
            
            // Populate subtopics dropdown
            subtopicSelect.innerHTML = '<option value="">All Sub-topics</option>';
            if (subject && subtopicsBySubject[subject]) {
                subtopicsBySubject[subject].forEach(topic => {
                    const opt = document.createElement("option");
                    opt.value = topic;
                    opt.innerText = topic;
                    subtopicSelect.appendChild(opt);
                });
            } else {
                // Add all subtopics if "All Subjects" selected
                Object.values(subtopicsBySubject).flat().forEach(topic => {
                     const opt = document.createElement("option");
                     opt.value = topic;
                     opt.innerText = topic;
                     subtopicSelect.appendChild(opt);
                });
            }
            renderTable();
        });
        document.getElementById("subtopicFilter").addEventListener("change", renderTable);

        // Run setup
        init();
        document.getElementById("subjectFilter").dispatchEvent(new Event('change')); // init subtopics
    </script>
